<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>군마트 장바구니</title>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
  :root{--bg:#f4f4f2;--card:#fff;--ink:#1d2321;--sub:#6e7772;--line:#e7e7e2;--accent:#2f7d4f;--accent-soft:#e4f1e8;--price:#d4381f}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Pretendard Variable',Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}
  .wrap{max-width:560px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 16px) 14px calc(env(safe-area-inset-bottom) + 110px)}
  header h1{margin:0;font-size:22px;letter-spacing:-.02em}
  header p{margin:4px 0 0;color:var(--sub);font-size:14px}
  .progress{margin:14px 0 6px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px}
  .progress .row{display:flex;justify-content:space-between;align-items:baseline;font-size:14px;color:var(--sub)}
  .progress .row b{font-size:20px;color:var(--ink)}
  .bar{height:10px;background:#ececE6;border-radius:99px;margin-top:10px;overflow:hidden}
  .bar i{display:block;height:100%;width:0;background:var(--accent);border-radius:99px;transition:width .25s}
  .done-msg{display:none;margin-top:10px;font-size:14px;color:var(--accent);font-weight:700}
  h2{font-size:14px;color:var(--sub);margin:20px 4px 8px;font-weight:600}
  ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
  .item{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden}
  .top{display:block;padding:0}
  .thumb{position:relative;width:100%;aspect-ratio:1/1;background:#efefeb;overflow:hidden;display:grid;place-items:center;font-size:72px}
  .thumb img{width:100%;height:100%;object-fit:cover;display:block}
  .thumb .badge{position:absolute;inset:0;background:rgba(47,125,79,.78);color:#fff;font-weight:800;font-size:26px;display:none;place-items:center}
  .item.done .thumb .badge{display:grid}
  .info{min-width:0;display:flex;flex-direction:column;padding:14px 16px 14px}
  .name{font-size:18px;font-weight:700;line-height:1.35;word-break:break-word}
  .unit{font-size:14px;color:var(--sub);margin-top:4px}
  .line{display:flex;align-items:center;justify-content:space-between;margin-top:10px}
  .qty{font-size:16px;font-weight:700}
  .sum{font-size:22px;font-weight:800;color:var(--price)}
  .check{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;border:0;border-top:1px solid var(--line);background:#fafaf8;padding:15px;font:inherit;font-size:16px;font-weight:700;color:var(--ink);cursor:pointer}
  .check .box{width:26px;height:26px;border-radius:7px;border:2.5px solid #a9b1ab;background:#fff;display:grid;place-items:center;color:#fff;font-size:17px;line-height:1}
  .item.done .check{background:var(--accent);color:#fff}
  .item.done .check .box{background:#fff;border-color:#fff;color:var(--accent)}
  .item.done .name,.item.done .unit,.item.done .sum{opacity:.55}
  .empty{text-align:center;color:var(--sub);padding:34px 0;font-size:15px;background:var(--card);border:1px dashed var(--line);border-radius:14px}
  .bottom{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);padding:12px 16px calc(env(safe-area-inset-bottom) + 12px);z-index:5}
  .bottom .in{max-width:560px;margin:0 auto;display:flex;justify-content:space-between;align-items:center}
  .bottom .lbl{display:block;font-size:12.5px;color:var(--sub);font-weight:600}
  .bottom .big{display:block;font-size:30px;line-height:1.15;font-weight:800;color:var(--accent);letter-spacing:-.02em}
  .bottom .main{text-align:right}
  .bottom .side{text-align:left}
  .bottom .all{display:block;font-size:15px;font-weight:600;color:var(--sub)}
  .hint{margin:12px 4px 0;font-size:12.5px;color:var(--sub)}
  .modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:flex-end;justify-content:center;z-index:50}
  .modal.open{display:flex}
  .sheet{background:#fff;width:100%;max-width:560px;border-radius:22px 22px 0 0;padding:26px 20px calc(env(safe-area-inset-bottom) + 20px)}
  .mtitle{font-size:22px;font-weight:800;letter-spacing:-.02em}
  .mname{font-size:15px;color:var(--sub);margin-top:8px;line-height:1.4}
  .mbtns{display:flex;gap:10px;margin-top:22px}
  .mbtns button{flex:1;font:inherit;font-size:17px;font-weight:700;padding:16px;border-radius:14px;border:0;cursor:pointer}
  .mno{background:#eeeeea;color:var(--ink)}
  .mskip{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:18px;font-size:14px;color:var(--sub);cursor:pointer}
  .mskip input{width:20px;height:20px;margin:0;accent-color:var(--accent)}
  .myes{background:var(--accent);color:#fff;flex:1.4!important}
  .warn{margin-top:10px;background:#fff1ec;border:1.5px solid #f0b4a3;border-radius:10px;padding:10px 12px}
  .warn .wt{font-size:15px;font-weight:800;color:#c0361a}
  .warn .wb{font-size:13px;color:#7a2a18;margin-top:4px;line-height:1.5}
  .check{justify-content:space-between!important;padding:16px 18px!important;font-size:17px!important}
  .check .box{order:2;width:36px;height:36px;border-radius:10px;font-size:24px;border-width:3px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>🛒 군마트 장바구니</h1>
    <p>사진을 보고 같은 제품을 찾아 바구니에 담고, 담으면 체크하세요.</p>
  </header>
  <section class="progress">
    <div class="row"><span>바구니에 담은 물건</span><span><b id="cnt">0</b> / <span id="tot">0</span>개 품목</span></div>
    <div class="bar"><i id="fill"></i></div>
    <div class="done-msg" id="doneMsg">다 담았어요! 계산하러 가세요 🎉</div>
  </section>
  <h2>담을 물건</h2>
  <ul id="todo"></ul>
  <h2 id="h-done">담은 물건</h2>
  <ul id="done"></ul>
  <p class="hint">체크는 이 휴대폰에만 저장돼요.</p>
</div>
<div class="modal" id="modal"><div class="sheet">
  <div class="mtitle" id="mTitle"></div>
  <div class="mname" id="mName"></div>
  <div class="mbtns"><button type="button" class="mno" id="mNo">아직이에요</button><button type="button" class="myes" id="mYes">네, 담았어요</button></div>
  <label class="mskip"><input type="checkbox" id="mSkip"><span>잘 챙길게요. 다음부터 묻지 않기</span></label>
</div></div>
<div class="bottom"><div class="in">
  <div class="side"><span class="lbl">전체 예상</span><span class="all" id="allAmt">0원</span></div>
  <div class="main"><span class="lbl">담은 제품 금액</span><span class="big" id="gotAmt">0원</span></div>
</div></div>

<script>
(function(){
  // 상품 목록 (이미지가 없는 상품은 아이콘으로 표시됩니다)
  var ITEMS=[
    {id:"p01",name:"온그리디언츠 스킨배리어 카밍로션",price:16160,qty:1,img:"cart-img/ongredients-calming-lotion.jpg"},
    {id:"p02",name:"파티온 노스카나인 트러블 흔적세럼",price:7670,qty:1,img:"cart-img/fation-nosca9-trouble-serum.jpg"},
    {id:"p03",name:"아비브 수분초 콜라겐 겔 마스크팩 10매",price:15400,qty:1,img:"cart-img/abib-collagen-gel-mask.jpg"},
    {id:"p04",name:"아누아 어성초 80 수분 진정 앰플",price:7270,qty:2,img:"cart-img/anua-heartleaf-80-ampoule.jpg"},
    {id:"p05",name:"이니스프리 비자시카밤",price:6900,qty:1,img:"cart-img/inisfree-bija-cica-balm.jpg"},
    {id:"p06",name:"파넬 시카마누 92세럼",price:9900,qty:1,img:"cart-img/parnell-cicamanu.jpg"},
    {id:"p07",name:"메이크프렘 클렌징폼",price:5800,qty:2,img:"cart-img/makeprem-foam.jpg"},
    {id:"p08",name:"라운드랩 자작나무 수분크림",price:10750,qty:1,img:"cart-img/roundlab-birch-moisture-cream.jpg",warnTitle:"⚠️ 선크림이 아니에요! 수분크림이에요",warn:"선크림 말고 \'수분크림\'을 찾아 주세요. 파란 박스에 \'수분강자 자작크림 · 대용량\'이라고 적혀 있고, 수분패드 증정품이 들어 있어요."},
    {id:"p09",name:"메디힐 워터마이드 속보습패드",price:10400,qty:2,img:"cart-img/mediheal-watermide.jpg"}
  ];
  var KEY="gunmart_done_v2", done={};
  try{ done=JSON.parse(localStorage.getItem(KEY)||"{}")||{}; }catch(e){ done={}; }
  function save(){ try{ localStorage.setItem(KEY,JSON.stringify(done)); }catch(e){} }
  var $=function(i){return document.getElementById(i)};
  function won(n){ return n.toLocaleString("ko-KR")+"원"; }

  function mk(it){
    var d=!!done[it.id], li=document.createElement("li"), card=document.createElement("div");
    card.className="item"+(d?" done":""); li.appendChild(card);
    var top=document.createElement("div"); top.className="top"; card.appendChild(top);
    var th=document.createElement("div"); th.className="thumb";
    if(it.img){ var im=document.createElement("img"); im.src=it.img; im.alt=it.name; im.loading="lazy"; th.appendChild(im); } else th.textContent="🛍️";
    var bd=document.createElement("div"); bd.className="badge"; bd.textContent="담음 ✓"; th.appendChild(bd); top.appendChild(th);
    var inf=document.createElement("div"); inf.className="info"; top.appendChild(inf);
    var n=document.createElement("div"); n.className="name"; n.textContent=it.name; inf.appendChild(n);
    if(it.warnTitle){ var wn=document.createElement("div"); wn.className="warn"; var wt=document.createElement("div"); wt.className="wt"; wt.textContent=it.warnTitle; wn.appendChild(wt); if(it.warn){ var wb=document.createElement("div"); wb.className="wb"; wb.textContent=it.warn; wn.appendChild(wb); } inf.appendChild(wn); }
    var u=document.createElement("div"); u.className="unit"; u.textContent="개당 "+won(it.price); inf.appendChild(u);
    var ln=document.createElement("div"); ln.className="line"; inf.appendChild(ln);
    var q=document.createElement("div"); q.className="qty"; q.textContent="수량 "+it.qty+"개"; ln.appendChild(q);
    var s=document.createElement("div"); s.className="sum"; s.textContent=won(it.price*it.qty); ln.appendChild(s);
    var ck=document.createElement("button"); ck.type="button"; ck.className="check";
    var bx=document.createElement("span"); bx.className="box"; bx.textContent=d?"✓":"";
    var tx=document.createElement("span"); tx.textContent=d?"바구니에 담았어요":"바구니에 담았나요?";
    ck.appendChild(bx); ck.appendChild(tx);
    ck.onclick=function(){ if(done[it.id]){ delete done[it.id]; save(); render(); } else if(it.qty>=2 && !skip){ openModal(it); } else { done[it.id]=true; save(); render(); } };
    card.appendChild(ck); return li;
  }
  var pendingItem=null, skip=false;
  try{ skip=localStorage.getItem("gunmart_skip_confirm")==="1"; }catch(e){}
  function openModal(it){ pendingItem=it; $("mSkip").checked=false; $("mTitle").textContent=it.qty+"개 모두 담았나요?"; $("mName").textContent=it.name; $("modal").classList.add("open"); }
  function closeModal(){ $("modal").classList.remove("open"); pendingItem=null; }
  $("mNo").onclick=closeModal;
  $("modal").addEventListener("click",function(e){ if(e.target===this) closeModal(); });
  $("mYes").onclick=function(){ var it=pendingItem; closeModal(); if($("mSkip").checked){ skip=true; try{ localStorage.setItem("gunmart_skip_confirm","1"); }catch(e){} } if(it) { done[it.id]=true; save(); render(); }; };
  function render(){
    var todo=$("todo"), dn=$("done"); todo.textContent=""; dn.textContent="";
    var nd=0, all=0, got=0;
    ITEMS.forEach(function(it){ var sub=it.price*it.qty; all+=sub; if(done[it.id]){ nd++; got+=sub; dn.appendChild(mk(it)); } else todo.appendChild(mk(it)); });
    $("cnt").textContent=nd; $("tot").textContent=ITEMS.length;
    $("fill").style.width=ITEMS.length?Math.round(nd/ITEMS.length*100)+"%":"0";
    $("doneMsg").style.display=(nd===ITEMS.length)?"block":"none";
    $("gotAmt").textContent=won(got); $("allAmt").textContent=won(all);
    if(!todo.children.length){ var e=document.createElement("div"); e.className="empty"; e.textContent="모두 담았어요"; todo.appendChild(e); }
    $("h-done").style.display=dn.children.length?"block":"none";
  }
  render();
})();
</script>
</body>
</html>
